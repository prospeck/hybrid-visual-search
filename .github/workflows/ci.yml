name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra frontend
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=visual_search --cov-report=term-missing --cov-fail-under=80
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ml.yml config --quiet
      - run: docker build -t hybrid-visual-search:test .

