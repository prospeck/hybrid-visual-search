[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hybrid-visual-search"
version = "0.1.0"
description = "Hybrid visual retrieval with YOLO metadata, CLIP embeddings, and FAISS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "prospeck" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<2.5",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ml = [
  "faiss-cpu>=1.10,<2",
  "open-clip-torch>=3.1,<4",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "ultralytics>=8.3,<9",
]
frontend = ["streamlit>=1.46,<2", "pandas>=2.3,<3"]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
visual-search = "visual_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_search"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["faiss", "open_clip", "torch", "torch.*", "ultralytics", "streamlit", "streamlit.*", "pandas", "pandas.*"]
ignore_missing_imports = true

